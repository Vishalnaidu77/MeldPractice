apiVersion: apps/v1
kind: Deployment
metadata:
  name:  auth-deployment
  labels:
    name:  auth-deployment
spec:
  replicas:  1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
      - image:  auth
        name:  auth-container
        resources:
          requests:
            cpu: "264m"
            memory: "128Mi"
          limits:
            cpu: "512m"
            memory: "264Mi"
        livenessProbe:
          httpGet:
            path: /_status/healthz
            port: 8000
          initialDelaySeconds: 90
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /_status/healthz
            port: 8000
          initialDelaySeconds: 30
          timeoutSeconds: 10
        env:
        - name:  MONGO_URI
          valueFrom:
            secretKeyRef:
              name:  database
              key:  AUTH 

        - name:  GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name:  google
              key:  GOOGLE_CLIENT_ID   

        - name:  GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name:  google
              key:  GOOGLE_CLIENT_SECRET

        - name:  JWT_SECRET
          valueFrom:
            secretKeyRef:
              name:  google
              key:  JWT_SECRET

        - name:  QUEUE_URL
          valueFrom:
            secretKeyRef:
              name:  database
              key:  QUEUE_URL

        ports:
        - containerPort:  8000
          name:  auth-http