apiVersion: apps/v1
kind: Deployment
metadata:
  name:  ai-deployment
  labels:
    name:  ai-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app:  ai-server
  template:
    metadata:
      labels:
        app: ai-server
    spec:
      containers:
      - image:  ai-orchestration
        name:  ai-orchestration
        resources:
          requests:
            cpu: "250m"
            memory: "128M"
          limits:
            cpu: "500m"
            memory: "256M"
        livenessProbe:
          httpGet:
            path: /api/ai/healthz
            port: 8000
          initialDelaySeconds: 90
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/ai/healthz
            port: 8000
          initialDelaySeconds: 30
          timeoutSeconds: 10      
        ports:
        - containerPort:  8000
          name:  ai-server-port