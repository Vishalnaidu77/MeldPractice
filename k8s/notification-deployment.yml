apiVersion: apps/v1
kind: Deployment
metadata:
  name:  notification-deployment
  labels:
    name:  notification-deployment
spec:
  replicas:  1
  selector:
    matchLabels:
      app:  notification
  template:
    metadata:
      labels:
        app:  notification
    spec:
      containers:
      - image:  notification
        name:  notification-container
        resources:
          requests:
            cpu: "20m"
            memory: "55M"
          limits: 
            cpu: "50m"
            memory: "100M"
        livenessProbe:
          httpGet:
            path: /_status/healthz
            port: 3000
          initialDelaySeconds: 90
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /_status/healthz
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 10
        env:
        - name:  QUEUE_URL
          valueFrom:
            secretKeyRef:
              name:  database
              key:  QUEUE_URL  

        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name:  google
              key:  GOOGLE_CLIENT_ID

        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name:  google
              key:  GOOGLE_CLIENT_SECRET

        - name: REFRESH_TOKEN
          valueFrom:
            secretKeyRef:
              name:  google
              key:  REFRESH_TOKEN

        - name:  EMAIL_USER
          valueFrom:
            secretKeyRef:
              name:  google
              key:  EMAIL_USER
        ports:
        - containerPort:  3000
          name: http